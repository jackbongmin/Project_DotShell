spring.application.name=dotshell-engine

# 엔진은 같은 PC의 Electron 클라이언트만 접속하므로 루프백에만 연다.
server.address=127.0.0.1
server.port=8730

# 플레이어 컨테이너
dotshell.player.image=dotshell/player:proto
# 이미지가 없을 때 빌드할 Dockerfile 폴더 (engine 폴더 기준 상대 경로)
dotshell.player.build-context=../docker/player
dotshell.player.memory-mb=512
dotshell.player.cpus=1.0
dotshell.player.pids-limit=256
