<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src ws://127.0.0.1:* ws://localhost:*">
  <title>DotShell</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span class="title">DotShell</span>
    <span id="stage-name" class="chapter">서버 왕국 수호</span>
    <span class="spacer"></span>
    <span class="label">현재 위치</span>
    <span id="cwd">-</span>
  </header>

  <main id="world-wrap">
    <div id="world"></div>
    <div id="toast" class="hidden"></div>
    <div id="spellbook" class="hidden">
      <div class="book">
        <header>
          <h2><img src="assets/sprites/scroll.png" alt="" class="icon"> 명령어 주문서</h2>
          <span class="pause-badge">일시정지</span>
          <span class="hint">읽는 동안 시간과 몬스터가 멈춥니다 · F1 · Esc 로 돌아가기</span>
        </header>
        <div id="cards"></div>
      </div>
    </div>
    <div id="result" class="hidden">
      <div class="result-box">
        <h1 id="result-title"></h1>
        <ul id="result-stars"></ul>
        <p id="result-stats"></p>
        <button id="retry" type="button" tabindex="-1">다시 도전</button>
      </div>
    </div>
  </main>

  <aside id="side">
    <button id="spellbook-btn" type="button" tabindex="-1">
      <img src="assets/sprites/scroll.png" alt="" class="icon">
      <span>명령어 주문서</span>
      <kbd>F1</kbd>
      <span id="spellbook-badge" class="badge hidden">NEW</span>
    </button>
    <section class="card">
      <h2>퀘스트</h2>
      <div id="quest-title">-</div>
      <ul class="goals" id="goals"></ul>
    </section>
    <section class="card daemon-card">
      <h2><img src="assets/sprites/daemon.png" alt="" class="icon"> 데몬</h2>
      <p id="daemon-line">...</p>
    </section>
    <section class="card log-card">
      <h2>명령 기록</h2>
      <ol id="command-log"></ol>
    </section>
  </aside>

  <section id="terminal-wrap">
    <div id="terminal"></div>
    <div id="overlay" class="visible">
      <div id="overlay-text">엔진에 연결하는 중...</div>
    </div>
  </section>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/phaser/dist/phaser.min.js"></script>
  <script src="common.js"></script>
  <script src="village.js"></script>
  <script src="battle.js"></script>
  <script src="boot.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
